[package]
name = "tft-api"
description = "The read-only /api routes the React app calls, and the built app, served by `tft serve`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
regex.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
# Correctly rounded float parsing, as JSON.parse: the dev stress switch re-reads answers it reshapes.
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha1.workspace = true
tft-core.workspace = true
tft-riot.workspace = true
tft-store.workspace = true
tokio.workspace = true
